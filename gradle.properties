org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft, Fabric and Loom come with the addon plugin (build.gradle), at the versions its core was built with.
# The oldest core this Essentials works with (its fabric.mod.json depends on it) and the one it builds against.
myriad_version=1.3.0

# Essentials
mod_version=1.6.0
maven_group=dev.myriadclient
archives_base_name=myriad-essentials

# Dev client only: ViaFabricPlus, to join test servers as an older version (`-Pvia`, see build.gradle).
viafabricplus_version=5.0.2
# Litematica, for the Printer (compiled against; in the dev client with -Plitematica).
litematica_version=0.28.8
malilib_version=0.29.6
xaero_minimap_version=fabric-26.2-26.6.0
xaero_worldmap_version=fabric-26.2-1.47.0
