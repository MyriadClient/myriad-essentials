// The Myriad addon plugin (released with core) sets up what every addon has: Loom, Minecraft, Fabric and Myriad, the
// dev client and its switches, checkApiOnly (Essentials is an ordinary addon and may only use Myriad's public API),
// the maven publication and publishAddon. `-PcoreDir=../myriad` builds against a core checkout next to this one, the
// plugin included. What's below is Essentials' own.
plugins {
	id 'dev.myriadclient.addon' version '0.10.0'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// ViaFabricPlus and Xaero's maps for the dev client only.
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
}

dependencies {
	// Most 2b2t players join through ViaFabricPlus as an older version, so the dev client does too (see `via` below).
	localRuntime "maven.modrinth:viafabricplus:${project.viafabricplus_version}"
	// Xaero's maps in the dev client, for the features that take waypoints (core reads them); -PnoMaps leaves them out.
	if (!project.hasProperty("noMaps")) {
		localRuntime "maven.modrinth:xaeros-minimap:${project.xaero_minimap_version}"
		localRuntime "maven.modrinth:xaeros-world-map:${project.xaero_worldmap_version}"
	}
}

// The protocol the dev client joins servers with, through ViaFabricPlus: 1.20.4 by default (what most 2b2t players
// use), `-Pvia=native` for the client's own. Singleplayer is never translated.
def viaProtocol = project.findProperty("via")?.toString() ?: "1.20.4"
def runDir = project.findProperty("runDir")?.toString() ?: "run"
def selectViaProtocol = tasks.register("selectViaProtocol") {
	def settings = file("${runDir}/config/viafabricplus/settings.json")
	inputs.property("via", viaProtocol)
	outputs.upToDateWhen { false }
	doLast {
		def json = settings.exists() ? new groovy.json.JsonSlurper().parse(settings) : [:]
		json.general = (json.general ?: [:]) + [save_selected_protocol_version: true]
		json.selected_protocol_version = viaProtocol == "native" ? project.minecraft_version : viaProtocol
		settings.parentFile.mkdirs()
		settings.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
		logger.lifecycle("ViaFabricPlus joins servers as ${json.selected_protocol_version}")
	}
}
tasks.matching { it.name == "runClient" }.configureEach { dependsOn selectViaProtocol }

loom {
	runs {
		client {
			// The Grim test server is set up like 2b2t's (tools/grim-test/start.sh), so the client clicks there as on 2b2t.
			// -Pstrict (with ./start.sh --strict) for current Grim's rules.
			property("myriad.noInputRuleHosts", project.hasProperty("strict") ? "" : "localhost,127.0.0.1")
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.compilerArgs += ["-Xmaxerrs", "10000"]
}
